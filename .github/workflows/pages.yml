name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포를 직렬화한다. cancel-in-progress 를 켜면 절반쯤 올라간 배포가 취소되어
# 사이트가 부분적으로만 갱신된 상태로 남는데, 그건 기다리는 것보다 나쁘다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 빌드보다 먼저 돈다. 카탈로그의 url 오타와 i18n 키 누락은 sqzass 가
      # 확인해 주지 않는 유일한 참조라, 여기서 안 잡으면 조용히 배포된다.
      - name: Check content integrity
        run: python3 tools/check.py

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # TODO: sqzer-x/sqzass#1 이 머지되면 --branch 를 지운다.
      # 목록에 날짜를 실어 오는 PageRefCtx.date 가 그 PR 에 있고, Posts 원장이
      # 그걸 쓴다.
      - name: Install sqzass
        run: cargo install --git https://github.com/sqzer-x/sqzass --branch feat/pageref-date --locked

      - uses: actions/configure-pages@v6

      - name: Build
        run: sqzass build -i .

      # 재현성은 sqzass 가 내세우는 것이므로 이 사이트에서도 확인한다.
      # 같은 입력을 두 번 빌드해서 바이트가 다르면 배포하지 않는다.
      - name: Build again and compare
        run: |
          mv public /tmp/first
          sqzass build -i .
          diff -r /tmp/first public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # concurrency 는 워크플로 실행을 직렬화하지만 Pages 배포는 자기를 띄운
      # 실행보다 오래 산다. 커밋 두 개를 붙여서 밀면 두 번째가 그 틈에 들어가
      # "due to in progress deployment" 로 400 을 받는다. 한 번 더 시도하면
      # 되고, 안전하다 — 배포는 아무것도 바꾸기 전에 실패한다.
      - name: Wait for the previous deployment to settle
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
