{% extends "base.html" %}

{% block content %}
<div class="wrap wrap-read">
  <header class="page-head" data-reveal>
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="page-lede">{{ page.description }}</p>
    {%- endif %}
  </header>

  <div class="fence" aria-hidden="true">+++</div>

  <div class="prose">
    {{ page.content | safe }}
  </div>
</div>
{% endblock %}
