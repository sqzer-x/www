# 템플릿이 공급하는 문자열. 본문은 content/ 에 있다.
# 한쪽 언어에 키가 없으면 빌드 에러다 — 기본 언어로 떨어뜨리면 한국어 페이지에
# 영어 라벨이 섞여 나가고, 그건 읽는 사람에게만 보이고 고치는 사람에게는 안 보인다.
#
# **크롬은 두 언어가 같다.** 내비, 푸터, 컨트롤 라벨은 한국어 페이지에서도 영어로
# 둔다. 번역되는 것은 읽으러 온 것 — 제목, 설명, 본문 — 뿐이다. 여기 영어가
# 반복되는 것은 빠뜨린 게 아니라 그 결정이다.
#
# 예외는 404 다. 그건 라벨이 아니라 읽는 사람에게 건네는 문장이라 번역한다.

